# Unit tests + production build on every push and PR.
# Vercel only proves the bundle compiles; this also runs the sync / merge
# tests that guard against Arguments edits being overwritten.
name: test

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Same resolver as the Vercel build (npm install, not npm ci), so CI
      # fails for the same reasons production would and no others.
      - name: Install
        run: npm install --no-audit --no-fund 2>&1 | tee install.log || { tail -n 15 install.log | sed 's/^/::error::/'; exit 1; }
        shell: bash -o pipefail {0}
      # Failures are also echoed as annotations so they can be read from the
      # API without downloading the full log.
      - name: Unit tests
        run: npm test 2>&1 | tee test.log || { grep -E "FAIL|✗|×|AssertionError|Error:" test.log | head -n 30 | sed 's/^/::error::/'; exit 1; }
        shell: bash -o pipefail {0}
      - name: Build
        run: npm run build
